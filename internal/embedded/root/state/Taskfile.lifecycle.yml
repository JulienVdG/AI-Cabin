version: '3'

# Shared lifecycle targets included by every cabin Taskfile (flatten: true,
# optional: true). The cabin owns setup, deps, and agent
# targets (pi, opencode); these targets depend on the cabin's setup (and deps
# for the build) via cross-file task references. AGENT_SERVICE (default: agent)
# is declared by the cabin's vars/env.

tasks:
  docker-up:
    desc: Start the cabin in background
    cmds:
      - task: setup
      - docker compose up -d

  docker-down:
    desc: Stop the cabin
    cmds:
      - docker compose down

  docker-build:
    desc: Build the cabin image
    cmds:
      - task: setup
      - task: deps
      - BUILDKIT_PROGRESS=plain docker compose build

  docker-shell:
    desc: Get a bash shell inside the agent container
    cmds:
      - docker compose exec {{.AGENT_SERVICE}} bash

  docker-greyshell:
    desc: Get a greywall sandboxed shell inside the agent container
    cmds:
      - docker compose exec {{.AGENT_SERVICE}} greybash

  docker-logs:
    desc: Follow agent container logs
    cmds:
      - docker compose logs -f {{.AGENT_SERVICE}}

  docker-restart:
    desc: Restart the agent container
    cmds:
      - task: setup
      - docker compose restart {{.AGENT_SERVICE}}
