ai-cabin:
  cabin: opencode-go
  agents: [opencode]
  features: [git-agent, go]

version: '3'

# Shared lifecycle targets provided by ai-cabin and materialized to XDG state;
# flatten: true exposes them at the root (task docker-up), optional: true keeps
# `task` standalone working before the CLI materializes the file. The shared
# `prepare` target runs this cabin's `setup` for its agent dirs and configs.
includes:
  lifecycle:
    taskfile: '{{.AI_CABIN_LIFECYCLE_TASKFILE | default "~/.local/state/ai-cabin/Taskfile.lifecycle.yml"}}'
    flatten: true
    optional: true

# Cabin vars: AGENT_SERVICE is the compose service running the agent, required
# by the shared lifecycle targets.
vars:
  AGENT_SERVICE: "agent"

# Env: exported to the task subprocess (docker-compose reads ${VAR} from here).
env:
  # In-container user home (matches the Dockerfile's USER).
  CONTAINER_HOME: /home/ai_agent
  # Per-wrapper greywall extras: opencode exposes its web inbound port via
  # greywall's --port so the host can reach the agent's web UI.
  GREYWALL_ARGS: "-p 9090"

tasks:
  default:
    desc: Start the cabin (docker-up + info)
    cmds:
      - task: docker-up
      - task: info

  setup:
    desc: Agent-specific setup (opencode dirs + configs)
    preconditions:
      - sh: '[ -v AI_CABIN_HOME ]'
        msg: "missing environment variable AI_CABIN_HOME"
      - sh: '[ -v AI_CABIN_DESK ]'
        msg: "missing environment variable AI_CABIN_DESK"
      - sh: '[ -v AI_CABIN_WORKDIR ]'
        msg: "missing environment variable AI_CABIN_WORKDIR"
    cmds:
      - mkdir -p {{.AI_CABIN_HOME}}/.local/share/opencode
      - mkdir -p {{.AI_CABIN_HOME}}/.local/state/opencode
      - mkdir -p {{.AI_CABIN_HOME}}/.config/opencode
      - mkdir -p {{.AI_CABIN_HOME}}/.cache/opencode
      - cat "{{.AI_CABIN_DESK}}/AGENTS.md" "{{.AI_CABIN_HOME}}/.cache/ai-cabin/AGENTS-workspace.md" > "{{.AI_CABIN_HOME}}/.config/opencode/AGENTS.md"
      # go feature dirs (greywall go profile)
      - mkdir -p {{.AI_CABIN_HOME}}/go
      - mkdir -p {{.AI_CABIN_HOME}}/.cache/go-build {{.AI_CABIN_HOME}}/.cache/golangci-lint
      - touch {{.AI_CABIN_HOME}}/.local/state/ai-cabin/container_bash_history

  opencode:
    desc: Continue opencode session (greywall sandboxed TUI)
    cmds:
      - docker compose exec -e CABIN_REL_PATH="${CABIN_REL_PATH}" agent opencode {{.CLI_ARGS}}

  up:
    desc: Start the cabin (alias for docker-up + info)
    cmds:
      - task: docker-up
      - task: info

  down:
    desc: Stop the cabin (alias for docker-down)
    cmds:
      - task: docker-down

  info:
    desc: Show cabin access info
    cmds:
      - |
        echo "greyproxy (host):            http://localhost:43080"
        echo "AI Agent (opencode web):     http://localhost:9090 (use chromium)"
    silent: true

  help:
    desc: Show usage
    cmds:
      - |
        echo "Environment variables (must be set before running task):"
        echo "  AI_CABIN_HOME      : Host home directory (e.g., /home/user/)"
        echo "  AI_CABIN_DESK      : Shared desk directory (AGENTS.md, skills)"
        echo "  AI_CABIN_WORKDIR   : Git repositories"
        echo "  SCW_PROJECT_ID     : Scaleway project ID"
        echo "  CONTAINER_WORKDIR  : Container workdir (default: AI_CABIN_WORKDIR, advanced)"
        echo ""
        echo "Usage:"
        echo "  task prepare         # Full setup (common dirs + agent configs)"
        echo "  task docker-up       # Start cabin"
        echo "  task docker-shell    # Get shell inside container"
        echo "  task opencode        # opencode TUI"
        echo "  task docker-greyshell # Greywall sandboxed shell"
        echo "  task docker-logs     # Follow logs"
        echo ""
        echo "Advanced:"
        echo "  CONTAINER_WORKDIR=/workspace task docker-up  # Remap workdir to /workspace"
    silent: true
